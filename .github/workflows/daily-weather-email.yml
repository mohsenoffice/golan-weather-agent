name: Daily weather email

on:
  schedule:
    # 04:00 UTC = 07:00 Israel time during DST, 06:00 in winter
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send weather email
        env:
          SMTP_USER: mohsen.office@gmail.com
          MAIL_TO: mohsen.office@gmail.com
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 weather_email.py
